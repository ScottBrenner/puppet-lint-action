---
name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Run unit tests
        run: npm test

  integ:
    name: Integration (${{ matrix.os }})
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run puppet-lint --version
        uses: ./
        with:
          args: --version

      - name: Install specific puppet-lint version without running
        uses: ./
        with:
          args: ''
          version: '4.2.4'

      - name: Verify puppet-lint in PATH
        run: puppet-lint --version

      - name: Lint example manifest
        uses: ./
        with:
          args: examples/test.pp
